[project]
name = "usgs-earthquake-live-monitor"
version = "0.1.0"
description = "Production-style but demo-friendly data engineering pipeline for USGS earthquake monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.13.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.13.1",
    "pyspark>=3.5,<3.6",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
packages = ["app", "spark_jobs"]
